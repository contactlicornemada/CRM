<style>

.head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:10px}.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}.brand .dot{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#236fe4,#102b66);border:1px solid #66b8ff;box-shadow:0 0 18px #1477ff55}.brand .dot:after{content:"";width:15px;height:15px;border-radius:50%;background:linear-gradient(145deg,#168cff,#0648a8);border:2px solid #07152e}

.mission-mascot{width:39px;height:43px;flex:none;position:relative}.mission-mascot:before{content:"";position:absolute;left:7px;top:8px;width:27px;height:30px;border:3px solid #050b18;border-radius:13px 14px 10px 10px;background:linear-gradient(135deg,#ffd52f 0 48%,#d88b00 100%);box-shadow:inset -5px -2px 0 #a45e00}.mission-mascot:after{content:"";position:absolute;left:12px;top:14px;width:19px;height:10px;border:2px solid #071329;border-radius:10px;background:linear-gradient(135deg,#c8f5ff,#2589d8);box-shadow:inset 2px 2px 0 #fff}
.mission-copy{min-width:0;flex:1}.mission-copy strong{display:block;font-family:'Space Grotesk';font-size:14px}.mission-copy span{display:block;color:#c0d2f3;font-size:11.5px;margin-top:3px;line-height:1.35}.mission-badge{font-size:10px;font-weight:800;letter-spacing:.08em;color:#7dc4ff;border:1px solid #3a8ee9;border-radius:8px;padding:5px 7px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:rgba(4,10,22,.72);border:1px solid var(--line);border-radius:13px;padding:4px}.tabs:before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:linear-gradient(135deg,#278cf2,#1455bd);box-shadow:0 4px 14px #1678ef55;transition:transform .3s cubic-bezier(.3,.8,.3,1);transform:translateX(calc(var(--p,0) * 100%))}
.tab{position:relative;z-index:1;padding:10px 0;font-size:12.5px;font-weight:700;color:#a5b4d1;display:flex;align-items:center;justify-content:center;gap:7px}.tab.on{color:white}.pill{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#ffffff20;font-size:10.5px;display:inline-grid;place-items:center;font-weight:800}
#viewport{flex:1;min-height:0;overflow:hidden;touch-action:pan-y;position:relative;z-index:1}#track{display:flex;width:200%;height:100%;will-change:transform;transition:transform .32s cubic-bezier(.3,.8,.3,1);transform:translate3d(calc(var(--p,0) * -50%),0,0)}#track.drag{transition:none}.slide{width:50%;height:100%;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.scroll::-webkit-scrollbar{width:0}
.bar{flex:none;padding:10px 14px calc(10px + var(--safe-b));background:linear-gradient(180deg,rgba(8,15,30,.75),#080f20 35%);border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
.btn{min-height:49px;border-radius:14px;padding:0 16px;font-size:14px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(145deg,#172744,#101b32);border:1px solid var(--line);box-shadow:0 5px 15px #0003;transition:transform .1s}.btn:active{transform:scale(.97)}.btn.primary{background:linear-gradient(135deg,#278df4,#1558c4);color:white;border:1px solid #62b6ff66;box-shadow:0 7px 22px -7px #1679f2a8}.btn:disabled{opacity:.35;box-shadow:none}.btn.submit{width:100%;height:49px;margin-top:10px;background:linear-gradient(135deg,#163b69,#10294d);border:1px solid #318ff0;color:#8fc9ff}.btn.icon{width:49px;padding:0;font-size:21px;flex:none}.btn.grow{flex:1}
.chipbtn{height:33px;padding:0 12px;border-radius:18px;background:#17243b;border:1px solid var(--line);font-size:11.5px;font-weight:700;white-space:nowrap;color:#b6c4df}.chipbtn:active{background:#243a60}
.search{display:flex;align-items:center;gap:10px;background:#111e35;border:1px solid var(--line);border-radius:13px;padding:0 13px;height:47px;margin:0 0 11px;box-shadow:inset 0 2px 8px #0003}.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px;min-width:0}.search input::placeholder{color:#8395b8}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none;touch-action:pan-x}.chips::-webkit-scrollbar{display:none}.chipbtn.on{background:linear-gradient(135deg,#1c65bd,#174c91);border-color:#4ba4ff;color:#fff;box-shadow:0 3px 12px #1679ef35}
.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:linear-gradient(115deg,rgba(21,36,64,.98),rgba(14,25,46,.98));border:1px solid rgba(116,164,231,.14);user-select:none;-webkit-user-select:none;transition:background .15s,border-color .15s;box-shadow:0 4px 12px #0002}.item:active{transform:scale(.99)}.item.sel{border-color:#328ff0;background:linear-gradient(110deg,rgba(29,91,163,.52),rgba(15,36,68,.96));box-shadow:0 0 0 1px #328ff044,0 6px 18px #0003}
.chk{width:25px;height:25px;border-radius:8px;border:2px solid #63799e;flex:none;display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff}.item.sel .chk{background:#2184e8;border-color:#60b8ff}.info{flex:1;min-width:0}.nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11.5px;color:#9aaaca;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:10px;font-weight:800;padding:5px 7px;border-radius:7px;background:#ffc43d20;color:#ffd36a;white-space:nowrap;flex:none}.tag.late{background:#ff536426;color:#ff8994}
.empty{text-align:center;color:#9aaaca;padding:45px 16px;font-size:13px;line-height:1.6}.empty .ico{font-size:40px;margin-bottom:10px}.count{flex:1;font-size:11px;color:#a7b6d2;line-height:1.3}.count b{display:block;font-family:'Space Grotesk';font-size:22px;color:#fff}
.callhead{display:flex;align-items:center;justify-content:space-between;margin:1px 0 10px;font-size:11.5px;color:#a8badb;font-weight:700}.prog{height:6px;border-radius:4px;background:#ffffff14;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#25a0ff,#28d5df);border-radius:4px;transition:width .35s;box-shadow:0 0 10px #28aaff}
.who{font-family:'Space Grotesk';font-size:28px;font-weight:700;line-height:1.15;word-break:break-word}.who-sub{color:#9aaaca;font-size:13px;margin-top:6px}.company{margin-top:7px;font-size:14px;font-weight:700;color:#70bcff}
.lastc{margin-top:13px;background:linear-gradient(135deg,#142440,#101b31);border:1px solid var(--line);border-left:3px solid #278df4;border-radius:7px 13px 13px 7px;padding:11px 12px}.lastc-h{display:flex;justify-content:space-between;gap:8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8ea6ce;margin-bottom:7px}.lastc-b{font-size:13px;line-height:1.45;white-space:pre-wrap;max-height:120px;overflow:auto;word-break:break-word}.note{padding:9px 0;border-top:1px solid #ffffff13}.note:first-of-type{border-top:0;padding-top:0}.note:last-child{padding-bottom:0}.note-d{font-size:10px;color:#72baff;font-weight:700;margin-bottom:3px}.note-b{font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.lastc-b.none{color:#899bbd;font-style:italic}
.phone{display:flex;align-items:center;justify-content:center;gap:12px;margin:17px 0 13px;min-height:65px;border-radius:17px;text-decoration:none;background:linear-gradient(135deg,#24a0f5,#1558c4);color:white;font-family:'Space Grotesk';font-size:23px;font-weight:700;box-shadow:0 10px 25px -10px #1685f5a8;word-break:break-all;padding:10px 16px;text-align:center}.phone:active{transform:scale(.98)}
.nophone{display:flex;gap:8px;margin:17px 0 13px}.nophone input{flex:1;min-width:0;height:53px;border-radius:14px;background:#111e35;border:1px solid var(--line);color:var(--text);padding:0 13px;font-size:16px;outline:0}.nophone .btn{height:53px}
.facts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}.fact{background:#182743;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:11px;color:#9eafd0}.fact b{color:#f1f5ff;font-weight:700}.lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#91a7cc;margin:17px 0 8px}
.hist{font-size:12px;color:#9aaaca;white-space:pre-wrap;background:#ffffff08;border-left:3px solid #278df4;border-radius:4px 10px 10px 4px;padding:10px 12px;max-height:100px;overflow:auto}
textarea{width:100%;min-height:130px;border-radius:14px;background:#111e35;border:1px solid var(--line);color:var(--text);padding:13px;font-size:15px;font-family:inherit;outline:0;resize:none;line-height:1.45}textarea:focus,.nophone input:focus,.search:focus-within{border-color:#389cff;box-shadow:0 0 0 3px #258cf022}textarea::placeholder{color:#8496b8}
.done{text-align:center;padding:55px 10px}.done .ico{font-size:55px}.done h2{font-size:24px;margin:12px 0 6px}.done p{color:#9aaaca;margin:0 0 24px;font-size:13px}.dots{display:flex;gap:6px;justify-content:center;padding-bottom:2px}
#toastHost{position:fixed;left:0;right:0;bottom:calc(92px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none}.toast{background:#eaf3ff;color:#07152a;padding:11px 16px;border-radius:13px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px #0008;animation:up .25s}.toast.err{background:#ff5364;color:#fff}@keyframes up{from{opacity:0;transform:translateY(8px)}}
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,rgba(36,117,230,.32),transparent 48%),linear-gradient(160deg,#101d39,#060b17)}
#login form{width:100%;max-width:360px;text-align:center;padding:27px 21px;border:1px solid var(--line);border-radius:22px;background:#0d193ef0;box-shadow:0 20px 60px #0008}
#login .dot{width:54px;height:54px;border-radius:17px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(145deg,#236fe4,#102b66);border:1px solid #66b8ff;box-shadow:0 0 25px #1477ff55}#login .dot:after{content:"";width:27px;height:20px;border-radius:13px;border:3px solid #07152e;background:linear-gradient(135deg,#d5f8ff,#2688d6);box-shadow:inset 3px 2px 0 #fff}
#login h1{font-size:24px;margin:0 0 4px}#login p{margin:0 0 20px;color:#a5b8da;font-size:13px}#login input{width:100%;height:53px;border-radius:14px;background:#111e35;border:1px solid var(--line);color:var(--text);padding:0 16px;font-size:16px;outline:0;margin-bottom:8px;text-align:center}#login input:focus{border-color:#389cff}#loginErr{min-height:20px;color:#ff8190;font-size:12px;margin-bottom:8px}#login .btn{width:100%}
@media(min-width:700px){#app{max-width:520px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px #0009}}
@media(max-height:650px){header{padding-top:calc(7px + var(--safe-t));padding-bottom:7px}.mission-banner{padding:7px 10px;margin-bottom:7px}.mission-mascot{height:34px}.scroll{padding-top:8px}.phone{min-height:56px;margin:12px 0}textarea{min-height:100px}}

</style>

<body>

<div id="login">
  <form id="loginForm">
    <div class="dot"></div>
    <h1>Centre de mission</h1>
    <p>Accès sécurisé · Équipage commercial</p>
    <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password">
    <div id="loginErr"></div>
    <button class="btn primary" type="submit">Se connecter</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="head-row">
      <div class="brand"><div class="dot"></div>CRM Licorne</div>
      <span id="status">Connexion…</span>
    </div>
    <div class="mission-banner">
      <div class="mission-mascot" aria-hidden="true"></div>
      <div class="mission-copy"><strong>Briefing de mission</strong><span>Ton équipage commercial est prêt. Priorise les contacts et fais décoller le CA.</span></div>
      <span class="mission-badge">EN LIGNE</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-p="0">🛰️ Équipage <span class="pill" id="pillSel">0</span></button>
      <button class="tab" data-p="1">📡 Mission <span class="pill" id="pillCall">–</span></button>
    </div>
  </header>

  <div id="viewport">
    <div id="track">

      <!-- ===== SLIDE 1 : sélection ===== -->
      <section class="slide" id="slide0">
        <div class="scroll" id="scroll0">
          <div class="search"><span>🔎</span><input id="q" placeholder="Scanner un prospect ou un contact…" enterkeyhint="search"></div>
          <div class="chips" id="chips"></div>
          <div class="list" id="list"></div>
        </div>
        <div class="bar">
          <div class="count"><b id="selCount">0</b>sélectionné(s)</div>
          <button class="btn icon" id="menuBtn" title="Console de mission">⋯</button>
          <button class="btn primary" id="startBtn" disabled>🚀 Lancer la mission</button>
        </div>
      </section>

      <!-- ===== SLIDE 2 : appel ===== -->
      <section class="slide" id="slide1">
        <div class="scroll" id="scroll1"><div id="callBody"></div></div>
        <div class="bar" id="callBar">
          <button class="btn icon" id="prevBtn" title="Précédent">←</button>
          <button class="btn primary grow" id="nextBtn">Contact suivant →</button>
        </div>
      </section>

    </div>
  </div>
</div>
<div id="toastHost"></div>

<script>
const SUPABASE_URL = 'https://efyomnxnzjcqosobqxeo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-1SDSkv_CTL29sluc_yKZg_TcmEV2ia';
const APP_PASSWORD = 'Angela#110';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PHONE_KEYS = ['telephone','téléphone','tel','phone','numero','numéro','num_tel','contact_tel','mobile','gsm','telephone_contact'];

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => { const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const todayISO = () => iso(new Date());
const score = p => (Number(p.potentiel_financier)||0) * (Number(p.chances_closing)||0) / 100;
const frDateTime = s => new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const frDate = s => { if(!s) return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); };

const S = { prospects:[], selected:new Set(), queue:[], idx:0, finished:false, q:'', sector:'', page:0, lastComments:{} };

// Dernier commentaire de chaque prospect de la file (table prospect_comments)
async function fetchLastComments(ids){
  S.lastComments = {};
  if(!ids.length) return;
  const { data, error } = await sb.from('prospect_comments').select('prospect_id,commentaire,created_at')
    .in('prospect_id', ids).order('created_at',{ascending:false});
  if(error){ console.error(error); return; }
  (data||[]).forEach(c=>{
    const arr = S.lastComments[c.prospect_id] || (S.lastComments[c.prospect_id] = []);
    if(arr.length < 3) arr.push(c);          // on garde les 3 plus récentes
  });
}
function lastNotesOf(p){
  const arr = S.lastComments[p.id];
  if(arr && arr.length) return arr.map(c=>({ text:c.commentaire, date:c.created_at }));
  const n = (p.prochain_action||'').trim();           // à défaut : notes globales de la fiche
  if(n) return n.split(/\n\s*\n/).filter(Boolean).slice(-3).reverse().map(t=>({ text:t.trim(), date:null }));
  return [];
}
function lastBoxHTML(p){
  const notes = lastNotesOf(p);
  return `<div class="lastc">
    <div class="lastc-h"><span>${notes.length>1?'3 derniers rapports':'Dernier rapport'}</span></div>
    ${notes.length ? notes.map(n=>`<div class="note">
      ${n.date?`<div class="note-d">${frDateTime(n.date)}</div>`:''}
      <div class="note-b">${esc(n.text.length>400 ? n.text.slice(0,400)+'…' : n.text)}</div></div>`).join('')
      : '<div class="lastc-b none">Aucune note pour le moment.</div>'}
  </div>`;
}

function toast(msg, err){
  const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.textContent=msg;
  $('#toastHost').appendChild(el); setTimeout(()=>el.remove(),2400);
}
function vib(ms=12){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
function loadSel(){ try{ return new Set(JSON.parse(localStorage.getItem('appels_sel')||'[]')); }catch(e){ return new Set(); } }
function saveSel(){ localStorage.setItem('appels_sel', JSON.stringify([...S.selected])); }
function manualPhones(){ try{ return JSON.parse(localStorage.getItem('appels_phones')||'{}'); }catch(e){ return {}; } }
function getPhone(p){
  for(const k of PHONE_KEYS){ if(p[k] && String(p[k]).trim()) return String(p[k]).trim(); }
  return manualPhones()[p.id] || '';
}
const telHref = n => 'tel:' + n.replace(/[^\d+]/g,'');

/* ================= Navigation entre les 2 slides ================= */
function setPage(n, animate=true){
  S.page = n;
  const root = document.documentElement;
  root.style.setProperty('--p', n);
  $$('.tab').forEach((t,i)=>t.classList.toggle('on', i===n));
  $('#tabs').style.setProperty('--p', n);
  // l'écran hors-champ ne doit pas être atteignable au clavier
  $('#slide0').inert = n!==0;
  $('#slide1').inert = n!==1;
}

(function swipe(){
  const vp = $('#viewport'), track = $('#track');
  let sx=0, sy=0, dx=0, lock=null, down=false, t0=0, moved=false;
  const skip = el => el.closest('input,textarea,select,.chips');
  vp.addEventListener('pointerdown', e=>{
    if(skip(e.target)) return;
    down=true; lock=null; dx=0; moved=false; sx=e.clientX; sy=e.clientY; t0=Date.now();
  });
  vp.addEventListener('pointermove', e=>{
    if(!down) return;
    const mx=e.clientX-sx, my=e.clientY-sy;
    if(lock===null && (Math.abs(mx)>10 || Math.abs(my)>10)){
      lock = Math.abs(mx) > Math.abs(my)*1.2 ? 'x' : 'y';
      if(lock==='x'){ track.classList.add('drag'); try{ vp.setPointerCapture(e.pointerId); }catch(_){} }
    }
    if(lock!=='x') return;
    moved=true; dx=mx;
    if((S.page===0 && dx>0) || (S.page===1 && dx<0)) dx*=.25;  // résistance aux bords
    track.style.transform = `translate3d(calc(${-S.page*50}% + ${dx}px),0,0)`;
  });
  const end = ()=>{
    if(!down) return; down=false;
    track.classList.remove('drag'); track.style.transform='';
    if(lock==='x'){
      const w = vp.clientWidth, v = Math.abs(dx)/(Date.now()-t0||1);
      if(Math.abs(dx) > w*.22 || v>.5){
        if(dx<0 && S.page===0){ setPage(1); vib(); }
        else if(dx>0 && S.page===1){ setPage(0); vib(); }
      }
    }
    lock=null;
  };
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);
  // empêche le "click" fantôme après un glissement
  vp.addEventListener('click', e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } }, true);
  document.addEventListener('keydown', e=>{
    if(e.target.closest('input,textarea,select')) return;
    if(e.key==='ArrowRight') setPage(0);
    if(e.key==='ArrowLeft'){ setPage(1); }
  });
})();

/* ================= Données ================= */
async function load(){
  const { data, error } = await sb.from('prospects').select('*').order('id',{ascending:true});
  if(error){ $('#status').textContent='Hors ligne'; toast('Erreur : '+error.message,true); return; }
  S.prospects = data||[];
  $('#status').textContent = S.prospects.length+' prospects';
  const ids = new Set(S.prospects.map(p=>p.id));
  S.selected = new Set([...loadSel()].filter(id=>ids.has(id)));
  renderChips(); renderList(); renderCall();
}

/* ================= Slide 1 ================= */
function renderChips(){
  const sectors = [...new Set(S.prospects.map(p=>p.secteur).filter(Boolean))].sort();
  $('#chips').innerHTML = `<button class="chipbtn ${S.sector===''?'on':''}" data-s="">Tous</button>` +
    sectors.map(s=>`<button class="chipbtn ${S.sector===s?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
}
function filtered(){
  const t = S.q.toLowerCase();
  return S.prospects.filter(p=>{
    if(S.sector && p.secteur!==S.sector) return false;
    if(!t) return true;
    return [p.nom,p.contact_resp,p.secteur,p.email].map(x=>(x||'').toLowerCase()).join(' ').includes(t);
  }).sort((a,b)=>score(b)-score(a));
}
function renderList(){
  const rows = filtered(), today = todayISO();
  $('#list').innerHTML = rows.length ? rows.map(p=>{
    const sel = S.selected.has(p.id), ph = getPhone(p);
    let tag = '';
    if(p.date_relance){
      if(p.date_relance < today) tag = '<span class="tag late">En retard</span>';
      else if(p.date_relance === today) tag = '<span class="tag">Aujourd\'hui</span>';
    }
    return `<div class="item ${sel?'sel':''}" data-id="${p.id}">
      <div class="chk">${sel?'✓':''}</div>
      <div class="info"><div class="nm">${esc(p.nom)}</div>
      <div class="meta">${esc(p.contact_resp||'—')}${ph?' · '+esc(ph):''}</div></div>${tag}</div>`;
  }).join('') : '<div class="empty"><div class="ico">🗂️</div>Aucun signal détecté dans cette zone.</div>';
  const n = S.selected.size;
  $('#selCount').textContent = n;
  $('#pillSel').textContent = n;
  $('#startBtn').disabled = n===0;
}
function toggle(id){ S.selected.has(id)?S.selected.delete(id):S.selected.add(id); saveSel(); vib(8); renderList(); }

function openMenu(){
  // petit menu de raccourcis via boîte native pour rester léger
  const c = prompt("Raccourcis :\n1 = Relances du jour\n2 = Tout sélectionner (liste affichée)\n3 = Tout désélectionner","1");
  const today=todayISO();
  if(c==='1'){ let n=0; S.prospects.forEach(p=>{ if(p.date_relance && p.date_relance<=today){ S.selected.add(p.id); n++; } }); toast(n+' relance(s) sélectionnée(s)'); }
  else if(c==='2'){ filtered().forEach(p=>S.selected.add(p.id)); }
  else if(c==='3'){ S.selected.clear(); }
  else return;
  saveSel(); renderList();
}

/* ================= Slide 2 ================= */
async function startCalls(){
  S.queue = S.prospects.filter(p=>S.selected.has(p.id)).sort((a,b)=>score(b)-score(a));
  S.idx = 0; S.finished = false;
  if(!S.queue.length) return;
  $('#startBtn').disabled = true;
  await fetchLastComments(S.queue.map(p=>p.id));
  $('#startBtn').disabled = S.selected.size===0;
  renderCall();
  setPage(1);
  $('#scroll1').scrollTop = 0;
}
function renderCall(){
  const total = S.queue.length;
  const bar = $('#callBar');
  if(!total){
    $('#pillCall').textContent = '–';
    bar.classList.add('hidden');
    $('#callBody').innerHTML = `<div class="empty"><div class="ico">📞</div>Aucune mission active.<br>Sélectionnez des prospects puis appuyez sur <b>Démarrer appel</b>.</div>`;
    return;
  }
  if(S.finished || S.idx >= total){
    $('#pillCall').textContent = '✓';
    bar.classList.add('hidden');
    $('#callBody').innerHTML = `<div class="done"><div class="ico">✅</div><h2>Mission accomplie</h2>
      <p>${total} appel(s) traité(s).</p><button class="btn primary" id="backBtn" style="width:100%">Retour à l’équipage</button></div>`;
    $('#backBtn').onclick = ()=> setPage(0);
    return;
  }
  bar.classList.remove('hidden');
  const p = S.queue[S.idx], ph = getPhone(p), last = lastCommentOf(p);
  const person = (p.contact_resp||'').trim();
  $('#pillCall').textContent = (S.idx+1)+'/'+total;
  $('#prevBtn').disabled = S.idx===0;
  $('#nextBtn').textContent = S.idx===total-1 ? 'Terminer la mission ✓' : 'Contact suivant →';
  $('#callBody').innerHTML = `
    <div class="callhead"><span>Contact ${S.idx+1} sur ${total}</span><span>${esc(p.secteur||'')}</span></div>
    <div class="prog"><i style="width:${S.idx/total*100}%"></i></div>
    <div class="who">${esc(person || p.nom)}</div>
    ${person ? `<div class="company">🏢 ${esc(p.nom)}</div>` : ''}
    <div id="lastcBox">${lastBoxHTML(p)}</div>
    ${ph
      ? `<a class="phone" href="${telHref(ph)}">📞 Établir le contact</a>`
      : `<div class="nophone"><input id="manualPhone" type="tel" inputmode="tel" placeholder="Téléphone / canal de contact"><button class="btn" id="savePhoneBtn">OK</button></div>`}
    <div class="facts">
      ${p.propriete?`<span class="fact">Statut <b>${esc(p.propriete)}</b></span>`:''}
      ${p.dernier_contact?`<span class="fact">Dernier contact <b>${frDate(p.dernier_contact)}</b></span>`:''}
      ${p.date_relance?`<span class="fact">Relance <b>${frDate(p.date_relance)}</b></span>`:''}
    </div>
    <div class="lbl">Transmettre un rapport de mission</div>
    <textarea id="comment" placeholder="Compte-rendu : besoin, objection, prochaine action…"></textarea>
    <button class="btn submit" id="addNoteBtn" type="button">Envoyer le rapport</button>`;
  $('#addNoteBtn').onclick = submitNote;
  const sp = $('#savePhoneBtn');
  if(sp) sp.onclick = ()=>{
    const v = $('#manualPhone').value.trim(); if(!v) return;
    const m = manualPhones(); m[p.id]=v; localStorage.setItem('appels_phones', JSON.stringify(m));
    renderCall(); renderList();
  };
}
// Enregistre une nouvelle note (table prospect_comments) + met à jour la fiche
async function saveNote(p, text){
  const { error } = await sb.from('prospect_comments').insert({ prospect_id:p.id, commentaire:text });
  if(error){ toast("Rapport non transmis : "+error.message, true); return false; }
  const { error:e2 } = await sb.from('prospects').update({ dernier_contact: todayISO(), mise_a_jour: new Date().toISOString() }).eq('id', p.id);
  if(!e2) p.dernier_contact = todayISO();
  const arr = S.lastComments[p.id] || (S.lastComments[p.id] = []);
  arr.unshift({ prospect_id:p.id, commentaire:text, created_at:new Date().toISOString() });
  if(arr.length > 3) arr.length = 3;
  return true;
}
async function submitNote(){
  const p = S.queue[S.idx], ta = $('#comment'), btn = $('#addNoteBtn');
  const text = ta.value.trim();
  if(!text){ toast('Rédigez un rapport avant de le transmettre', true); ta.focus(); return; }
  btn.disabled = true;
  const ok = await saveNote(p, text);
  btn.disabled = false;
  if(!ok) return;
  ta.value = ''; vib();
  $('#lastcBox').innerHTML = lastBoxHTML(p);
  toast('Rapport transmis ✓');
}
async function nextCall(){
  const p = S.queue[S.idx];
  const text = ($('#comment')||{}).value ? $('#comment').value.trim() : '';
  const btn = $('#nextBtn'); btn.disabled = true;
  if(text){   // note rédigée mais non envoyée : on la sauvegarde pour ne rien perdre
    const ok = await saveNote(p, text);
    if(!ok){ btn.disabled=false; return; }
    toast('Rapport transmis ✓');
  }
  btn.disabled = false; vib();
  S.idx++;
  if(S.idx >= S.queue.length) S.finished = true;
  renderCall();
  $('#scroll1').scrollTop = 0;
}
function prevCall(){
  if(S.idx>0){ S.idx--; S.finished=false; renderCall(); $('#scroll1').scrollTop=0; }
}

/* ================= Init ================= */
function init(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  setPage(0);
  $$('.tab').forEach(t=> t.onclick = ()=> setPage(Number(t.dataset.p)));
  $('#list').addEventListener('click', e=>{ const it=e.target.closest('.item'); if(it) toggle(Number(it.dataset.id)); });
  $('#chips').addEventListener('click', e=>{ const b=e.target.closest('.chipbtn'); if(!b) return; S.sector=b.dataset.s; renderChips(); renderList(); });
  let t; $('#q').addEventListener('input', e=>{ clearTimeout(t); t=setTimeout(()=>{ S.q=e.target.value; renderList(); },150); });
  $('#startBtn').onclick = startCalls;
  $('#menuBtn').onclick = openMenu;
  $('#nextBtn').onclick = nextCall;
  $('#prevBtn').onclick = prevCall;
  renderCall();
  load();
}
$('#loginForm').onsubmit = e=>{
  e.preventDefault();
  if($('#pwd').value === APP_PASSWORD){ sessionStorage.setItem('appels_auth','ok'); init(); }
  else { $('#loginErr').textContent='Mot de passe incorrect.'; $('#pwd').value=''; }
};
if(sessionStorage.getItem('appels_auth')==='ok' || sessionStorage.getItem('crmlicorne_auth')==='ok') init();
</script>
