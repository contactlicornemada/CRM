<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050b18">
<title>Centre de mission — CRM Licorne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050b18;--panel:#0d1830;--panel2:#13224a;--line:rgba(96,165,255,.28);--text:#f4f7ff;--muted:#9aaaca;--brand:#39a0ff;--brand2:#1558c4;--warn:#ffc43d;--danger:#ff5364;--ok:#20d69a;--purple:#a45bff;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030710;color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
h1,h2,.display,.brand{font-family:'Space Grotesk',sans-serif}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
svg.mascot{display:block;flex:none}

#app{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
 background:radial-gradient(ellipse at 50% -10%,rgba(40,120,235,.38),transparent 50%),radial-gradient(circle at 90% 40%,rgba(120,70,220,.14),transparent 30%),linear-gradient(165deg,#0a1530 0%,#060c1c 60%,#080e20 100%)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
 background-image:radial-gradient(1px 1px at 8% 12%,#fff 99%,transparent),radial-gradient(1px 1px at 78% 8%,#fff 99%,transparent),radial-gradient(1.6px 1.6px at 42% 22%,#fff 99%,transparent),radial-gradient(1px 1px at 91% 34%,#fff 99%,transparent),radial-gradient(1px 1px at 17% 68%,#fff 99%,transparent),radial-gradient(1.6px 1.6px at 70% 84%,#fff 99%,transparent),radial-gradient(1px 1px at 55% 55%,#bcd8ff 99%,transparent);background-size:200px 180px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:.55}}

header{position:relative;z-index:2;flex:none;padding:calc(10px + var(--safe-t)) 14px 9px;background:linear-gradient(180deg,rgba(4,9,20,.95),rgba(8,16,34,.8));border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;line-height:1.05}
.brand small{display:block;font-size:12px;font-weight:600;color:#9cc3ff}
.head-right{display:flex;align-items:center;gap:8px}
#status{font-size:11px;color:#9db9e5;background:#12244a;border:1px solid var(--line);border-radius:20px;padding:7px 10px;white-space:nowrap}
#bell{position:relative;width:38px;height:38px;border-radius:50%;background:#12244a;border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
#bell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);font-size:10.5px;display:grid;place-items:center;padding:0 4px}
#bell b.hidden{display:none}
.mission-banner{display:flex;align-items:center;gap:11px;padding:9px 12px;margin-bottom:10px;border:1px solid rgba(89,159,255,.45);border-radius:16px;background:linear-gradient(105deg,rgba(21,57,112,.88),rgba(10,20,42,.94));box-shadow:0 8px 24px #0006}
.mission-copy{min-width:0;flex:1}.mission-copy strong{display:block;font-family:'Space Grotesk';font-size:15px}
.mission-copy span{display:block;color:#c0d2f3;font-size:11.5px;margin-top:3px;line-height:1.35}
.mission-badge{font-size:10px;font-weight:800;letter-spacing:.08em;color:#7dc4ff;border:1px solid #3a8ee9;border-radius:8px;padding:5px 7px}

.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:rgba(4,10,22,.75);border:1px solid var(--line);border-radius:13px;padding:4px}
.tabs:before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:linear-gradient(135deg,#278cf2,#1455bd);box-shadow:0 4px 14px #1678ef55;transition:transform .3s cubic-bezier(.3,.8,.3,1);transform:translateX(calc(var(--p,0) * 100%))}
.tab{position:relative;z-index:1;padding:10px 0;font-size:12.5px;font-weight:700;color:#a5b4d1;display:flex;align-items:center;justify-content:center;gap:7px}
.tab.on{color:#fff}.pill{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#ffffff22;font-size:10.5px;display:inline-grid;place-items:center;font-weight:800}

#viewport{flex:1;min-height:0;overflow:hidden;touch-action:pan-y;position:relative;z-index:1}
#track{display:flex;width:200%;height:100%;will-change:transform;transition:transform .32s cubic-bezier(.3,.8,.3,1);transform:translate3d(calc(var(--p,0) * -50%),0,0)}
#track.drag{transition:none}
.slide{width:50%;height:100%;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0}
.bar{flex:none;padding:10px 14px calc(10px + var(--safe-b));background:linear-gradient(180deg,rgba(8,15,30,.8),#080f20 35%);border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}

.btn{min-height:49px;border-radius:14px;padding:0 16px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(145deg,#172744,#101b32);border:1px solid var(--line);box-shadow:0 5px 15px #0003;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#278df4,#1558c4);color:#fff;border:1px solid #62b6ff66;box-shadow:0 7px 22px -7px #1679f2a8}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.submit{width:100%;margin-top:10px;background:linear-gradient(135deg,#163b69,#10294d);border:1px solid #318ff0;color:#8fc9ff}
.btn.danger{background:linear-gradient(135deg,#ff5364,#c42b44);color:#fff;border-color:#ff8a96}
.btn.icon{width:49px;padding:0;font-size:21px;flex:none}.btn.grow{flex:1}
.chipbtn{height:33px;padding:0 12px;border-radius:18px;background:#17243b;border:1px solid var(--line);font-size:11.5px;font-weight:700;white-space:nowrap;color:#b6c4df;flex:none}
.chipbtn.on{background:linear-gradient(135deg,#1c65bd,#174c91);border-color:#4ba4ff;color:#fff}

/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:15px;background:linear-gradient(135deg,rgba(19,34,74,.95),rgba(10,20,44,.95));border:1px solid var(--line)}
.kpi .ic{font-size:25px;flex:none}.kpi b{display:block;font-family:'Space Grotesk';font-size:19px;line-height:1.1}
.kpi span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.alerts{border:1px solid rgba(255,83,100,.45);border-radius:15px;background:linear-gradient(135deg,rgba(60,20,40,.7),rgba(14,22,44,.9));padding:11px 12px;margin-bottom:11px}
.alerts h3{margin:0 0 7px;font-family:'Space Grotesk';font-size:14px;display:flex;align-items:center;gap:7px}
.alrow{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:5px 0;color:#dbe6ff}
.alrow i{width:9px;height:9px;border-radius:50%;flex:none}
.alerts .btn{min-height:42px;width:100%;margin-top:8px;font-size:13px}

.search{display:flex;align-items:center;gap:10px;background:#0f1c38;border:1px solid var(--line);border-radius:13px;padding:0 13px;height:47px;margin:0 0 11px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px;min-width:0}
.search input::placeholder{color:#8395b8}.search:focus-within{border-color:#389cff}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:linear-gradient(115deg,rgba(21,36,64,.98),rgba(14,25,46,.98));border:1px solid rgba(116,164,231,.16);user-select:none;-webkit-user-select:none;box-shadow:0 4px 12px #0002}
.item:active{transform:scale(.99)}
.item.sel{border-color:#328ff0;background:linear-gradient(110deg,rgba(29,91,163,.55),rgba(15,36,68,.96));box-shadow:0 0 0 1px #328ff044}
.avatar{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:18px;background:linear-gradient(145deg,#1f4fa8,#102b66);border:1px solid #4f9bff66}
.item.sel .avatar{background:linear-gradient(145deg,#2f9bff,#1558c4)}
.info{flex:1;min-width:0}.nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;font-weight:800;padding:5px 7px;border-radius:7px;background:#ffc43d22;color:#ffd36a;white-space:nowrap;flex:none}
.tag.late{background:#ff536428;color:#ff8994}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid #63799e;flex:none;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.item.sel .chk{background:#2184e8;border-color:#60b8ff}
.empty{text-align:center;color:var(--muted);padding:38px 16px;font-size:13px;line-height:1.6}
.empty .ico{font-size:40px;margin-bottom:10px}
.empty svg{margin:0 auto 10px}
.count{flex:1;font-size:11px;color:#a7b6d2;line-height:1.3}.count b{display:block;font-family:'Space Grotesk';font-size:22px;color:#fff}

/* appel */
.callhead{display:flex;align-items:center;justify-content:space-between;margin:1px 0 10px;font-size:11.5px;color:#a8badb;font-weight:700}
.prog{height:6px;border-radius:4px;background:#ffffff14;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#25a0ff,#28d5df);border-radius:4px;transition:width .35s;box-shadow:0 0 10px #28aaff}
.who{font-family:'Space Grotesk';font-size:28px;font-weight:700;line-height:1.15;word-break:break-word}
.company{margin-top:7px;font-size:14px;font-weight:700;color:#70bcff}
.lastc{margin-top:13px;background:linear-gradient(135deg,#142440,#101b31);border:1px solid var(--line);border-left:3px solid #278df4;border-radius:7px 13px 13px 7px;padding:11px 12px}
.lastc-h{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8ea6ce;margin-bottom:7px}
.lastc-b{font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.lastc-b.none{color:#899bbd;font-style:italic}
.note{padding:9px 0;border-top:1px solid #ffffff13}.note:first-of-type{border-top:0;padding-top:0}.note:last-child{padding-bottom:0}
.note-d{font-size:10px;color:#72baff;font-weight:700;margin-bottom:3px}.note-b{font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.phone{display:flex;align-items:center;justify-content:center;gap:12px;margin:17px 0 13px;min-height:65px;border-radius:17px;text-decoration:none;background:linear-gradient(135deg,#24a0f5,#1558c4);color:#fff;font-family:'Space Grotesk';font-size:21px;font-weight:700;box-shadow:0 10px 25px -10px #1685f5a8;padding:10px 16px;text-align:center}
.phone small{display:block;font-size:12px;font-weight:500;opacity:.85}
.phone:active{transform:scale(.98)}
.nophone{display:flex;gap:8px;margin:17px 0 13px}
.nophone input{flex:1;min-width:0;height:53px;border-radius:14px;background:#0f1c38;border:1px solid var(--line);color:var(--text);padding:0 13px;font-size:16px;outline:0}
.nophone .btn{height:53px}
.facts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.fact{background:#182743;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:11px;color:#9eafd0}.fact b{color:#f1f5ff}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#91a7cc;margin:17px 0 8px}
textarea{width:100%;min-height:120px;border-radius:14px;background:#0f1c38;border:1px solid var(--line);color:var(--text);padding:13px;font-size:16px;font-family:inherit;outline:0;resize:none;line-height:1.45}
textarea:focus{border-color:#389cff}textarea::placeholder{color:#8496b8}
.done{text-align:center;padding:40px 10px}.done svg{margin:0 auto}.done h2{font-size:24px;margin:12px 0 6px}.done p{color:var(--muted);margin:0 0 24px;font-size:13px}

/* feuille de menu */
#sheetWrap{position:fixed;inset:0;z-index:60;background:rgba(2,6,14,.7);display:flex;align-items:flex-end}
#sheet{width:100%;background:linear-gradient(180deg,#12244a,#0a1430);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 14px calc(14px + var(--safe-b));display:flex;flex-direction:column;gap:9px;animation:sheet .25s}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
#sheet h3{margin:0 0 4px;font-family:'Space Grotesk';font-size:16px}

#toastHost{position:fixed;left:0;right:0;bottom:calc(92px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70;pointer-events:none}
.toast{background:#eaf3ff;color:#07152a;padding:11px 16px;border-radius:13px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px #0008;animation:up .25s}
.toast.err{background:#ff5364;color:#fff}@keyframes up{from{opacity:0;transform:translateY(8px)}}

#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,rgba(36,117,230,.34),transparent 50%),linear-gradient(160deg,#101d39,#050a16)}
#login form{width:100%;max-width:360px;text-align:center;padding:27px 21px;border:1px solid var(--line);border-radius:22px;background:#0d193ef2;box-shadow:0 20px 60px #0008}
#login svg{margin:0 auto 12px}
#login h1{font-size:24px;margin:0 0 4px}#login p{margin:0 0 20px;color:#a5b8da;font-size:13px}
#login input{width:100%;height:53px;border-radius:14px;background:#0f1c38;border:1px solid var(--line);color:var(--text);padding:0 16px;font-size:16px;outline:0;margin-bottom:8px;text-align:center}
#login input:focus{border-color:#389cff}#loginErr{min-height:20px;color:#ff8190;font-size:12px;margin-bottom:8px}#login .btn{width:100%}

@media(min-width:700px){#app{max-width:520px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media(max-height:650px){header{padding-top:calc(6px + var(--safe-t));padding-bottom:6px}.mission-banner{padding:6px 10px;margin-bottom:6px}.phone{min-height:56px;margin:12px 0}textarea{min-height:90px}}
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <div id="loginMascot"></div>
    <h1>Centre de mission</h1>
    <p>Accès sécurisé · Équipage commercial</p>
    <input type="password" id="pwd" placeholder="Code d'accès" autocomplete="current-password">
    <div id="loginErr"></div>
    <button class="btn primary" type="submit">Embarquer 🚀</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="head-row">
      <div class="brand"><span id="brandMascot"></span><div>CRM<small>Licorne</small></div></div>
      <div class="head-right">
        <button id="status" type="button" title="Actualiser">Connexion…</button>
        <button id="bell" type="button" title="Alertes mission">🔔<b id="bellN" class="hidden">0</b></button>
      </div>
    </div>
    <div class="mission-banner">
      <span id="bannerMascot"></span>
      <div class="mission-copy"><strong>Bonjour Marco !</strong><span>Mission du jour : booster votre CA 🚀</span></div>
      <span class="mission-badge">EN LIGNE</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-p="0" type="button">🛰️ Équipage <span class="pill" id="pillSel">0</span></button>
      <button class="tab" data-p="1" type="button">📡 Mission <span class="pill" id="pillCall">–</span></button>
    </div>
  </header>

  <div id="viewport">
    <div id="track">
      <section class="slide" id="slide0">
        <div class="scroll" id="scroll0">
          <div class="kpis" id="kpis"></div>
          <div class="alerts" id="alerts"></div>
          <div class="search"><span>🔎</span><input id="q" placeholder="Scanner un membre ou une planète (société)…" enterkeyhint="search"></div>
          <div class="chips" id="chips"></div>
          <div class="list" id="list"></div>
        </div>
        <div class="bar">
          <div class="count"><b id="selCount">0</b>à bord</div>
          <button class="btn icon" id="menuBtn" type="button" title="Console de mission">⋯</button>
          <button class="btn primary" id="startBtn" type="button" disabled>🚀 Lancer la mission</button>
        </div>
      </section>

      <section class="slide" id="slide1">
        <div class="scroll" id="scroll1"><div id="callBody"></div></div>
        <div class="bar" id="callBar">
          <button class="btn icon" id="prevBtn" type="button" title="Précédent">←</button>
          <button class="btn primary grow" id="nextBtn" type="button">Contact suivant →</button>
        </div>
      </section>
    </div>
  </div>
</div>

<div id="sheetWrap" class="hidden"><div id="sheet"></div></div>
<div id="toastHost"></div>

<script>
const SUPABASE_URL = 'https://efyomnxnzjcqosobqxeo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-1SDSkv_CTL29sluc_yKZg_TcmEV2ia';
const APP_PASSWORD = 'Angela#110';
const sb = window.supabase?.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const PHONE_KEYS = ['telephone','téléphone','tel','phone','numero','numéro','num_tel','contact_tel','mobile','gsm','telephone_contact'];

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => { const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const todayISO = () => iso(new Date());
const score = p => (Number(p.potentiel_financier)||0) * (Number(p.chances_closing)||0) / 100;
const frDateTime = s => new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const frDate = s => { if(!s) return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); };
const euro = n => Math.round(n).toLocaleString('fr-FR')+' €';

/* Mascotte originale : licorne astronaute (SVG inline, aucune image externe) */
function mascot(size, suit){
  suit = suit || '#2f7dff';
  return `<svg class="mascot" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="g${size}${suit.slice(1)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f8ff"/><stop offset="1" stop-color="#6cc4ff"/></linearGradient></defs>
    <path d="M32 3 L37 17 L27 17 Z" fill="#ffd24a" stroke="#07152e" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14 24 q-6 8 -2 20 q6 -4 8 -12 Z" fill="#ff7ad9"/><path d="M12 30 q-5 6 -2 14 q5 -3 6 -9 Z" fill="#a45bff"/>
    <rect x="16" y="38" width="32" height="22" rx="10" fill="${suit}" stroke="#07152e" stroke-width="2.5"/>
    <circle cx="32" cy="27" r="16" fill="#e8f1ff" stroke="#07152e" stroke-width="2.5"/>
    <ellipse cx="32" cy="28" rx="11.5" ry="9" fill="url(#g${size}${suit.slice(1)})" stroke="#07152e" stroke-width="2"/>
    <circle cx="28" cy="27" r="1.8" fill="#07152e"/><circle cx="36" cy="27" r="1.8" fill="#07152e"/>
    <path d="M28.5 31.5 q3.5 3 7 0" fill="none" stroke="#07152e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M24 22 q4 -3 8 -3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </svg>`;
}

const S = { prospects:[], selected:new Set(), queue:[], idx:0, finished:false, q:'', sector:'', page:0, lastComments:{}, busy:false };

async function fetchLastComments(ids){
  S.lastComments = {};
  if(!ids.length) return;
  if(!sb){ toast('Connexion Supabase indisponible. Vérifiez votre connexion.', true); return; }
  let result;
  try {
    result = await sb.from('prospect_comments').select('prospect_id,commentaire,created_at')
      .in('prospect_id', ids).order('created_at',{ascending:false});
  } catch(err) { console.error(err); toast('Impossible de charger les rapports : '+(err.message||err), true); return; }
  const { data, error } = result;
  if(error){ console.error(error); toast('Rapports indisponibles : '+error.message, true); return; }
  (data||[]).forEach(c=>{
    const arr = S.lastComments[c.prospect_id] || (S.lastComments[c.prospect_id] = []);
    if(arr.length < 3) arr.push(c);
  });
}
function lastNotesOf(p){
  const arr = S.lastComments[p.id];
  if(arr && arr.length) return arr.map(c=>({ text:c.commentaire, date:c.created_at }));
  const n = (p.prochain_action||'').trim();
  if(n) return n.split(/\n\s*\n/).filter(Boolean).slice(-3).reverse().map(t=>({ text:t.trim(), date:null }));
  return [];
}
function lastBoxHTML(p){
  const notes = lastNotesOf(p);
  return `<div class="lastc">
    <div class="lastc-h">${notes.length>1?'3 derniers rapports de mission':'Dernier rapport de mission'}</div>
    ${notes.length ? notes.map(n=>`<div class="note">
      ${n.date?`<div class="note-d">${frDateTime(n.date)}</div>`:''}
      <div class="note-b">${esc(n.text.length>400 ? n.text.slice(0,400)+'…' : n.text)}</div></div>`).join('')
      : '<div class="lastc-b none">Aucun rapport pour le moment.</div>'}
  </div>`;
}

function toast(msg, err){
  const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.textContent=msg;
  $('#toastHost').appendChild(el); setTimeout(()=>el.remove(),2600);
}
function vib(ms=12){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
function loadSel(){ try{ return new Set(JSON.parse(localStorage.getItem('appels_sel')||'[]')); }catch(e){ return new Set(); } }
function saveSel(){ try{ localStorage.setItem('appels_sel', JSON.stringify([...S.selected])); }catch(e){} }
function manualPhones(){ try{ return JSON.parse(localStorage.getItem('appels_phones')||'{}'); }catch(e){ return {}; } }
function getPhone(p){
  for(const k of PHONE_KEYS){ if(p[k] && String(p[k]).trim()) return String(p[k]).trim(); }
  return manualPhones()[p.id] || '';
}
const telHref = n => 'tel:' + n.replace(/[^\d+]/g,'');

/* ===== Navigation 2 écrans ===== */
function setPage(n){
  S.page = n;
  document.documentElement.style.setProperty('--p', n);
  $$('.tab').forEach((t,i)=>t.classList.toggle('on', i===n));
  $('#tabs').style.setProperty('--p', n);
  $('#slide0').inert = n!==0;
  $('#slide1').inert = n!==1;
}

(function swipe(){
  const vp = $('#viewport'), track = $('#track');
  let sx=0, sy=0, dx=0, lock=null, down=false, t0=0, moved=false;
  const skip = el => el.closest('input,textarea,select,.chips');
  vp.addEventListener('pointerdown', e=>{
    if(skip(e.target)) return;
    down=true; lock=null; dx=0; moved=false; sx=e.clientX; sy=e.clientY; t0=Date.now();
  });
  vp.addEventListener('pointermove', e=>{
    if(!down) return;
    const mx=e.clientX-sx, my=e.clientY-sy;
    if(lock===null && (Math.abs(mx)>10 || Math.abs(my)>10)){
      lock = Math.abs(mx) > Math.abs(my)*1.2 ? 'x' : 'y';
      if(lock==='x'){ track.classList.add('drag'); try{ vp.setPointerCapture(e.pointerId); }catch(_){} }
    }
    if(lock!=='x') return;
    moved=true; dx=mx;
    if((S.page===0 && dx>0) || (S.page===1 && dx<0)) dx*=.25;
    track.style.transform = `translate3d(calc(${-S.page*50}% + ${dx}px),0,0)`;
  });
  const end = ()=>{
    if(!down) return; down=false;
    track.classList.remove('drag'); track.style.transform='';
    if(lock==='x'){
      const w = vp.clientWidth, v = Math.abs(dx)/(Date.now()-t0||1);
      if(Math.abs(dx) > w*.22 || v>.5){
        if(dx<0 && S.page===0){ setPage(1); vib(); }
        else if(dx>0 && S.page===1){ setPage(0); vib(); }
      }
    }
    lock=null;
  };
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);
  vp.addEventListener('click', e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } }, true);
  document.addEventListener('keydown', e=>{
    if(e.target.closest('input,textarea,select')) return;
    if(e.key==='ArrowLeft') setPage(0);
    if(e.key==='ArrowRight') setPage(1);
  });
})();

/* ===== Données ===== */
async function load(){
  $('#status').textContent = 'Synchro…';
  if(!sb){ $('#status').textContent='Hors ligne ↻'; toast('Bibliothèque Supabase non chargée. Rechargez la page.',true); return; }
  let result;
  try { result = await sb.from('prospects').select('*').order('id',{ascending:true}); }
  catch(err){ $('#status').textContent='Hors ligne ↻'; toast('Connexion impossible : '+(err.message||err),true); return; }
  const { data, error } = result;
  if(error){ $('#status').textContent='Hors ligne ↻'; toast('Erreur : '+error.message,true); return; }
  S.prospects = data||[];
  $('#status').textContent = S.prospects.length+' membres';
  const ids = new Set(S.prospects.map(p=>p.id));
  S.selected = new Set([...loadSel()].filter(id=>ids.has(id)));
  // garde la file d'appel cohérente avec les données rafraîchies
  S.queue = S.queue.map(q=>S.prospects.find(p=>p.id===q.id)).filter(Boolean);
  if(S.idx > S.queue.length) S.idx = S.queue.length;
  renderChips(); renderStats(); renderList(); renderCall();
}

/* ===== Écran 1 : Équipage ===== */
function dueList(){ const t=todayISO(); return S.prospects.filter(p=>p.date_relance && p.date_relance<=t); }
function renderStats(){
  const t = todayISO();
  const late = S.prospects.filter(p=>p.date_relance && p.date_relance<t).length;
  const today = S.prospects.filter(p=>p.date_relance===t).length;
  const ca = S.prospects.reduce((a,p)=>a+(Number(p.potentiel_financier)||0),0);
  const withCh = S.prospects.filter(p=>Number(p.chances_closing)>0);
  const avg = withCh.length ? withCh.reduce((a,p)=>a+Number(p.chances_closing),0)/withCh.length : 0;
  $('#kpis').innerHTML = `
    <div class="kpi"><span class="ic">👨‍🚀</span><div><b>${S.prospects.length}</b><span>Membres d'équipage</span></div></div>
    <div class="kpi"><span class="ic">🏆</span><div><b>${S.prospects.filter(p=>Number(p.chances_closing)>=50).length}</b><span>Missions chaudes</span></div></div>
    <div class="kpi"><span class="ic">💰</span><div><b>${euro(ca)}</b><span>CA prévisionnel</span></div></div>
    <div class="kpi"><span class="ic">🚀</span><div><b>${Math.round(avg)}%</b><span>Taux de closing</span></div></div>`;
  const n = late + today;
  const bn = $('#bellN'); bn.textContent = n; bn.classList.toggle('hidden', n===0);
  $('#alerts').innerHTML = `
    <h3>🚨 Alertes Mission</h3>
    <div class="alrow"><i style="background:var(--danger)"></i>${late} signal(aux) en retard (sabotage)</div>
    <div class="alrow"><i style="background:var(--warn)"></i>${today} relance(s) prévue(s) aujourd'hui</div>
    <button class="btn danger" id="alertBtn" type="button">Sélectionner les relances ${n?'('+n+')':''} →</button>`;
}
function renderChips(){
  const sectors = [...new Set(S.prospects.map(p=>p.secteur).filter(Boolean))].sort();
  $('#chips').innerHTML = `<button class="chipbtn ${S.sector===''?'on':''}" data-s="" type="button">🌌 Tous</button>` +
    sectors.map(s=>`<button class="chipbtn ${S.sector===s?'on':''}" data-s="${esc(s)}" type="button">${esc(s)}</button>`).join('');
}
function filtered(){
  const t = S.q.toLowerCase();
  return S.prospects.filter(p=>{
    if(S.sector && p.secteur!==S.sector) return false;
    if(!t) return true;
    return [p.nom,p.contact_resp,p.secteur,p.email].map(x=>(x||'').toLowerCase()).join(' ').includes(t);
  }).sort((a,b)=>score(b)-score(a));
}
function renderList(){
  const rows = filtered(), today = todayISO();
  $('#list').innerHTML = rows.length ? rows.map(p=>{
    const sel = S.selected.has(p.id), ph = getPhone(p);
    let tag = '';
    if(p.date_relance){
      if(p.date_relance < today) tag = '<span class="tag late">⚠ Sabotage</span>';
      else if(p.date_relance === today) tag = '<span class="tag">Aujourd\'hui</span>';
    }
    return `<div class="item ${sel?'sel':''}" data-id="${esc(p.id)}">
      <div class="avatar">${sel?'🧑‍🚀':'👤'}</div>
      <div class="info"><div class="nm">${esc(p.nom)}</div>
      <div class="meta">${esc(p.contact_resp||'—')}${ph?' · '+esc(ph):''}</div></div>${tag}
      <div class="chk">${sel?'✓':''}</div></div>`;
  }).join('') : `<div class="empty">${mascot(64)}Aucun signal détecté dans cette zone.</div>`;
  const n = S.selected.size;
  $('#selCount').textContent = n;
  $('#pillSel').textContent = n;
  $('#startBtn').disabled = n===0 || S.busy;
}
function toggle(id){
  const existing = [...S.selected].find(x=>String(x)===String(id));
  if(existing!==undefined) S.selected.delete(existing); else S.selected.add(id);
  saveSel(); vib(8); renderList();
}
function selectDue(){
  let n=0; dueList().forEach(p=>{ S.selected.add(p.id); n++; });
  saveSel(); renderList();
  toast(n ? n+' relance(s) embarquée(s) ✓' : 'Aucune relance à bord aujourd\'hui');
}

/* Console de mission (feuille du bas) */
function openMenu(){
  $('#sheet').innerHTML = `<h3>Console de mission</h3>
    <button class="btn primary" data-a="due" type="button">🚨 Embarquer les relances du jour</button>
    <button class="btn" data-a="all" type="button">🛰️ Tout embarquer (liste affichée)</button>
    <button class="btn" data-a="none" type="button">🧹 Tout débarquer</button>
    <button class="btn" data-a="refresh" type="button">🔄 Actualiser les données</button>
    <button class="btn" data-a="logout" type="button">🔒 Verrouiller l'application</button>
    <button class="btn" data-a="close" type="button">Fermer</button>`;
  $('#sheetWrap').classList.remove('hidden');
}
function closeMenu(){ $('#sheetWrap').classList.add('hidden'); }
function menuAction(a){
  closeMenu();
  if(a==='due') selectDue();
  else if(a==='all'){ filtered().forEach(p=>S.selected.add(p.id)); saveSel(); renderList(); }
  else if(a==='none'){ S.selected.clear(); saveSel(); renderList(); }
  else if(a==='refresh') load();
  else if(a==='logout'){ sessionStorage.removeItem('appels_auth'); sessionStorage.removeItem('crmlicorne_auth'); location.reload(); }
}

/* ===== Écran 2 : Mission ===== */
async function startCalls(){
  if(S.busy) return;
  S.queue = S.prospects.filter(p=>[...S.selected].some(id=>String(id)===String(p.id))).sort((a,b)=>score(b)-score(a));
  S.idx = 0; S.finished = false;
  if(!S.queue.length){ toast('Sélectionnez au moins un membre avant de lancer la mission.',true); renderList(); return; }
  S.busy = true; $('#startBtn').disabled = true;
  try {
    await fetchLastComments(S.queue.map(p=>p.id));
    renderCall();
    setPage(1);
    $('#scroll1').scrollTop = 0;
  } catch(err) {
    console.error(err);
    toast('La mission n’a pas pu démarrer : '+(err.message||err),true);
  } finally {
    S.busy = false;
    $('#startBtn').disabled = S.selected.size===0;
  }
}
function renderCall(){
  const total = S.queue.length;
  const bar = $('#callBar');
  if(!total){
    $('#pillCall').textContent = '–';
    bar.classList.add('hidden');
    $('#callBody').innerHTML = `<div class="empty">${mascot(72)}Aucune mission active.<br>Embarquez des membres puis appuyez sur <b>Lancer la mission</b>.</div>`;
    return;
  }
  if(S.finished || S.idx >= total){
    $('#pillCall').textContent = '✓';
    bar.classList.add('hidden');
    $('#callBody').innerHTML = `<div class="done">${mascot(90,'#20d69a')}<h2>Mission accomplie 🎉</h2>
      <p>${total} contact(s) traité(s). Bravo, commandant !</p><button class="btn primary" id="backBtn" type="button" style="width:100%">Retour à l’équipage</button></div>`;
    $('#backBtn').onclick = ()=> setPage(0);
    return;
  }
  bar.classList.remove('hidden');
  const p = S.queue[S.idx], ph = getPhone(p);
  const person = (p.contact_resp||'').trim();
  $('#pillCall').textContent = (S.idx+1)+'/'+total;
  $('#prevBtn').disabled = S.idx===0;
  $('#nextBtn').textContent = S.idx===total-1 ? 'Terminer la mission ✓' : 'Contact suivant →';
  $('#callBody').innerHTML = `
    <div class="callhead"><span>Contact ${S.idx+1} sur ${total}</span><span>${esc(p.secteur||'')}</span></div>
    <div class="prog"><i style="width:${S.idx/total*100}%"></i></div>
    <div class="who">${esc(person || p.nom)}</div>
    ${person ? `<div class="company">🪐 ${esc(p.nom)}</div>` : ''}
    <div id="lastcBox">${lastBoxHTML(p)}</div>
    ${ph
      ? `<a class="phone" href="${telHref(ph)}">📞 <span>Établir le contact<small>${esc(ph)}</small></span></a>`
      : `<div class="nophone"><input id="manualPhone" type="tel" inputmode="tel" placeholder="Numéro de téléphone"><button class="btn" id="savePhoneBtn" type="button">OK</button></div>`}
    <div class="facts">
      ${p.propriete?`<span class="fact">Statut <b>${esc(p.propriete)}</b></span>`:''}
      ${p.dernier_contact?`<span class="fact">Dernier contact <b>${frDate(p.dernier_contact)}</b></span>`:''}
      ${p.date_relance?`<span class="fact">Relance <b>${frDate(p.date_relance)}</b></span>`:''}
    </div>
    <div class="lbl">Transmettre un rapport de mission</div>
    <textarea id="comment" placeholder="Compte-rendu : besoin, objection, prochaine action…"></textarea>
    <button class="btn submit" id="addNoteBtn" type="button">📡 Envoyer le rapport</button>`;
  $('#addNoteBtn').onclick = submitNote;
  const sp = $('#savePhoneBtn');
  if(sp) sp.onclick = ()=>{
    const v = $('#manualPhone').value.trim(); if(!v){ toast('Saisissez un numéro', true); return; }
    const m = manualPhones(); m[p.id]=v;
    try{ localStorage.setItem('appels_phones', JSON.stringify(m)); }catch(e){}
    renderCall(); renderList();
  };
}
async function saveNote(p, text){
  if(!sb){ toast('Connexion Supabase indisponible.',true); return false; }
  let result;
  try { result = await sb.from('prospect_comments').insert({ prospect_id:p.id, commentaire:text }); }
  catch(err){ toast('Rapport non transmis : '+(err.message||err),true); return false; }
  const { error } = result;
  if(error){ toast("Rapport non transmis : "+error.message, true); return false; }
  let updateResult;
  try { updateResult = await sb.from('prospects').update({ dernier_contact: todayISO(), mise_a_jour: new Date().toISOString() }).eq('id', p.id); }
  catch(err){ console.error(err); updateResult={error:err}; }
  const e2 = updateResult.error;
  if(!e2) p.dernier_contact = todayISO();
  const arr = S.lastComments[p.id] || (S.lastComments[p.id] = []);
  arr.unshift({ prospect_id:p.id, commentaire:text, created_at:new Date().toISOString() });
  if(arr.length > 3) arr.length = 3;
  return true;
}
async function submitNote(){
  const p = S.queue[S.idx], ta = $('#comment'), btn = $('#addNoteBtn');
  if(!p || !ta) return;
  const text = ta.value.trim();
  if(!text){ toast('Rédigez un rapport avant de le transmettre', true); ta.focus(); return; }
  btn.disabled = true;
  const ok = await saveNote(p, text);
  btn.disabled = false;
  if(!ok) return;
  ta.value = ''; vib();
  $('#lastcBox').innerHTML = lastBoxHTML(p);
  toast('Rapport transmis ✓');
}
async function nextCall(){
  const p = S.queue[S.idx]; if(!p) return;
  const ta = $('#comment');
  const text = ta ? ta.value.trim() : '';
  const btn = $('#nextBtn'); btn.disabled = true;
  if(text){
    const ok = await saveNote(p, text);
    if(!ok){ btn.disabled=false; return; }
    toast('Rapport transmis ✓');
  }
  btn.disabled = false; vib();
  S.idx++;
  if(S.idx >= S.queue.length) S.finished = true;
  renderCall();
  $('#scroll1').scrollTop = 0;
}
function prevCall(){
  if(S.idx>0){ S.idx--; S.finished=false; renderCall(); $('#scroll1').scrollTop=0; }
}

window.addEventListener('unhandledrejection', e=>{ console.error(e.reason); toast('Une opération a échoué. Vérifiez la connexion puis réessayez.',true); });
window.addEventListener('error', e=>{ console.error(e.error||e.message); });

/* ===== Init ===== */
let inited = false;
function init(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  if(inited) return; inited = true;
  $('#brandMascot').innerHTML = mascot(36);
  $('#bannerMascot').innerHTML = mascot(44,'#a45bff');
  setPage(0);
  $$('.tab').forEach(t=> t.onclick = ()=> setPage(Number(t.dataset.p)));
  $('#list').addEventListener('click', e=>{ const it=e.target.closest('.item'); if(!it) return; const raw=it.dataset.id; const p=S.prospects.find(x=>String(x.id)===raw); if(p) toggle(p.id); });
  $('#chips').addEventListener('click', e=>{ const b=e.target.closest('.chipbtn'); if(!b) return; S.sector=b.dataset.s; renderChips(); renderList(); });
  let t; $('#q').addEventListener('input', e=>{ clearTimeout(t); t=setTimeout(()=>{ S.q=e.target.value; renderList(); },150); });
  $('#alerts').addEventListener('click', e=>{ if(e.target.closest('#alertBtn')) selectDue(); });
  $('#bell').onclick = ()=>{ setPage(0); $('#scroll0').scrollTo({top:0,behavior:'smooth'}); const n=dueList().length; toast(n? n+' relance(s) à traiter' : 'Aucune alerte, tout est calme 🌌'); };
  $('#status').onclick = load;
  $('#startBtn').onclick = ()=>startCalls().catch(err=>{ console.error(err); toast('Erreur au lancement : '+(err.message||err),true); });
  $('#menuBtn').onclick = openMenu;
  $('#sheetWrap').addEventListener('click', e=>{
    if(e.target.id==='sheetWrap') return closeMenu();
    const b=e.target.closest('[data-a]'); if(b) menuAction(b.dataset.a);
  });
  $('#nextBtn').onclick = nextCall;
  $('#prevBtn').onclick = prevCall;
  renderCall();
  load();
}
$('#loginMascot').innerHTML = mascot(64);
$('#loginForm').onsubmit = e=>{
  e.preventDefault();
  if($('#pwd').value === APP_PASSWORD){ sessionStorage.setItem('appels_auth','ok'); init(); }
  else { $('#loginErr').textContent='Code incorrect.'; $('#pwd').value=''; }
};
if(sessionStorage.getItem('appels_auth')==='ok' || sessionStorage.getItem('crmlicorne_auth')==='ok') init();
</script>
